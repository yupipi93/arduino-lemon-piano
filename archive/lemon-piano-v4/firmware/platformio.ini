; Lemon Piano — game firmware (rescued 2019 university project).
;
; nanoatmega328 → the Arduino Nano on the breadboard photo (most 2019-era
;     Nano clones ship the OLD bootloader, 57600 baud upload). This is the
;     default build.
; nanoatmega328new → same board with the NEW bootloader (115200 baud).
;     Try this env if upload fails with "programmer not responding".
; uno → Arduino Uno, same ATmega328P — the original banana piano ran on one.
;
; Build:    pio run
; Flash:    pio run -t upload
; Monitor:  pio device monitor   (enable Serial.begin in setup() first)

[platformio]
default_envs = nanoatmega328

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:uno]
board = uno

; Compile-check for the Velxio emulation input shim (digital active-low keys).
; Never flashed to hardware — the Velxio pipeline builds this variant itself
; via the `defines:` field in ../emulation/lemon-piano.yaml.
[env:emulation]
board = nanoatmega328
build_flags = -DVELXIO_EMULATION
