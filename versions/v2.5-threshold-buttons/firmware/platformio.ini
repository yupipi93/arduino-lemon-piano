; Lemon Piano V2.5 — keyboard test with a LIVE touch threshold (2026).
;
; V2's hardcoded `<= 1019` became a variable, tunable from two buttons on
; D10 / D11 while the piano runs, with the serial monitor showing the raw
; averages, the threshold and every note. See ../README.md.
;
; nanoatmega328 → default. Nano, OLD bootloader (57600 baud upload).
; nanoatmega328new → same board, NEW bootloader (115200). Try this if upload
;     fails with "programmer is not responding".
; uno → an Uno works too, but its DIP package has no A6, so key 7 is dead.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor        (9600 baud — this build is all about it)
[platformio]
default_envs = nanoatmega328

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:uno]
board = uno

; Compile-check for the Velxio emulation shim (buzzer moves to D9, key 7 to D12).
; Never flashed to hardware — the Velxio pipeline builds this variant itself via
; the `defines:` field in ../emulation/keyboard-test.yaml.
[env:emulation]
board = nanoatmega328
build_flags = -DVELXIO_EMULATION
