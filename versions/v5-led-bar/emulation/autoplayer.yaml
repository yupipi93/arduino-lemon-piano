wires:
  # Every key wired DIRECTLY board-pin -> button leg (NOT through the
  # pull-up resistor). Two things forced this, both found live and traced
  # through Velxio's own source (not guessed):
  #  1. Multi-board projects never get a real SPICE solve (`[verify]`
  #     reports nodes:["0"], vs. 35 real nodes for the single-board project)
  #     — so `spiceDrivenInputs` is false and every button falls back to the
  #     legacy path: walk wires through passives to find a board pin
  #     (`traceDetailed` in DynamicComponent.tsx). That walker returns the
  #     FIRST board pin it reaches per wire — including power pins, which
  #     `boardPinToNumber` resolves to -1 (not null!). Since the pull-ups'
  #     "5V side" pins are bussed together (`rp1:1 -> rp2:1 -> ...`), a
  #     button's trace tunnels through its own resistor onto that bus and
  #     dead-ends at -1 (GND) before ever reaching the real board pin. Same
  #     algorithm, same bug, on both v1 (INPUT_PULLUP, no resistor at all —
  #     see the finger-wire note below for why THAT failed) and v2 (real
  #     external pull-ups, which reintroduced the exact resistor-to-bus path
  #     this note describes).
  #  2. The pushbutton part itself (`BasicParts.ts`) already seeds its
  #     resolved pin HIGH on attach and pulls it LOW on press/back HIGH on
  #     release — a REAL pull-up resistor is not needed for this simulation
  #     mode at all. It's kept here purely for wiring-diagram realism, wired
  #     as a side branch off the SAME board pin (never touching the button),
  #     so it can never end up on a button's own trace.
  - [arduino-nano:A0, key1:1.l]
  - [arduino-nano:A0, rp1:2]
  - [arduino-nano:A1, key2:1.l]
  - [arduino-nano:A1, rp2:2]
  - [arduino-nano:A2, key3:1.l]
  - [arduino-nano:A2, rp3:2]
  - [arduino-nano:A3, key4:1.l]
  - [arduino-nano:A3, rp4:2]
  - [arduino-nano:A4, key5:1.l]
  - [arduino-nano:A4, rp5:2]
  - [arduino-nano:A5, key6:1.l]
  - [arduino-nano:A5, rp6:2]
  - [arduino-nano:12, key7:1.l]       # A6 has no digital pin; key 7 lives on D12
  - [arduino-nano:12, rp7:2]
  - [arduino-nano:5V, rp1:1]
  - [rp1:1, rp2:1]
  - [rp2:1, rp3:1]
  - [rp3:1, rp4:1]
  - [rp4:1, rp5:1]
  - [rp5:1, rp6:1]
  - [rp6:1, rp7:1]
  - [arduino-nano:GND.1, key1:2.l]
  - [key1:2.r, key2:2.l]
  - [key2:2.r, key3:2.l]
  - [key3:2.r, key4:2.l]
  - [key4:2.r, key5:2.l]
  - [key5:2.r, key6:2.l]
  - [key6:2.r, key7:2.l]
  # Ten-LED bar.
  - [arduino-nano:2,  rl1:1]
  - [rl1:2,  led1:A]
  - [arduino-nano:3,  rl2:1]
  - [rl2:2,  led2:A]
  - [arduino-nano:4,  rl3:1]
  - [rl3:2,  led3:A]
  - [arduino-nano:5,  rl4:1]
  - [rl4:2,  led4:A]
  - [arduino-nano:6,  rl5:1]
  - [rl5:2,  led5:A]
  - [arduino-nano:7,  rl6:1]
  - [rl6:2,  led6:A]
  - [arduino-nano:8,  rl7:1]
  - [rl7:2,  led7:A]
  - [arduino-nano:9,  rl8:1]
  - [rl8:2,  led8:A]
  - [arduino-nano:10, rl9:1]
  - [rl9:2,  led9:A]
  - [arduino-nano:13, rl10:1]
  - [rl10:2, led10:A]
  - [led1:C, led2:C]
  - [led2:C, led3:C]
  - [led3:C, led4:C]
  - [led4:C, led5:C]
  - [led5:C, led6:C]
  - [led6:C, led7:C]
  - [led7:C, led8:C]
  - [led8:C, led9:C]
  - [led9:C, led10:C]
  - [led10:C, arduino-nano:GND.2]
  - [arduino-nano:11, buzzer1:1]
  - [buzzer1:2, arduino-nano:GND.2]

  # ── The autoplayer's own indicator LEDs ────────────────────────────────────
  - [arduino-uno:2, lvlr1:1]
  - [lvlr1:2, lvled1:A]
  - [arduino-uno:3, lvlr2:1]
  - [lvlr2:2, lvled2:A]
  - [arduino-uno:4, lvlr3:1]
  - [lvlr3:2, lvled3:A]
  - [arduino-uno:5, lvlr4:1]
  - [lvlr4:2, lvled4:A]
  - [lvled1:C, lvled2:C]
  - [lvled2:C, lvled3:C]
  - [lvled3:C, lvled4:C]
  - [lvled4:C, arduino-uno:GND.2]

  # ── The 7 "fingers": through a 220Ω series resistor (fr1-fr7), NOT a bare
  # direct wire. A bare direct wire reliably drove auto-play, but a driven-
  # HIGH idle output on the exact same node as a real lemon button is a hard
  # short — it always won, so manual clicks went silent the moment the finger
  # wiring was fixed to actually reach piano (an earlier round). The
  # resistor turns that hard short into an ordinary voltage divider: a real
  # button's near-zero contact resistance still wins over 220Ω when someone
  # clicks a lemon, and the finger's own driven LOW still wins over piano's
  # own pull-up resistor when auto-playing. Verified live, in one continuous
  # session: autoplay wins level 1, piano auto-advances to level 2, and a
  # manual click on level 2's first note registers a fresh `OK 1/10` right
  # after — both paths working, back to back, no interference.
  - [arduino-uno:6,  fr1:1]
  - [fr1:2,  arduino-nano:A0]   # finger 1 -> key1's own board pin
  - [arduino-uno:7,  fr2:1]
  - [fr2:2,  arduino-nano:A1]   # finger 2 -> key2's own board pin
  - [arduino-uno:8,  fr3:1]
  - [fr3:2,  arduino-nano:A2]   # finger 3 -> key3's own board pin
  - [arduino-uno:9,  fr4:1]
  - [fr4:2,  arduino-nano:A3]   # finger 4 -> key4's own board pin
  - [arduino-uno:10, fr5:1]
  - [fr5:2,  arduino-nano:A4]   # finger 5 -> key5's own board pin
  - [arduino-uno:11, fr6:1]
  - [fr6:2,  arduino-nano:A5]   # finger 6 -> key6's own board pin
  - [arduino-uno:12, fr7:1]
  - [fr7:2,  arduino-nano:12]   # finger 7 -> key7's own board pin (D12)

  # ── Shared ground reference between the two boards ────────────────────────
  - [arduino-uno:GND.1, arduino-nano:GND.1]
