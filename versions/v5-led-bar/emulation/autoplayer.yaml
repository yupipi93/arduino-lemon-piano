name: lemon-piano-v5-autoplayer
description: >
  Interactive-only (multi-board specs run in `--mode interactive` in this
  harness — the CLI's verify assertions only ever watch one board per run).
  Two boards: `piano` is the real V5 game (identical circuit to
  lemon-piano.yaml), and `player` is a small companion Arduino Uno that acts as
  a "virtual finger": type a level number (1-4) into PLAYER'S OWN serial
  monitor tab to arm it (an LED shows which), then type `p` and it fires that
  level's 10-note code onto the SAME key nodes your own lemon clicks use —
  piano can't tell the difference between a player-board pulse and a real
  touch. Your 7 lemons stay fully clickable throughout for manual free play /
  deliberately wrong notes; the autoplayer only ever pulls a key node low the
  way a press would.
  The autoplayer has no idea what level `piano` actually thinks it's on — it
  can only offer levels 1-4 on request. Watch piano's own serial log ("Level
  N") or match the win/auto-advance you just heard, and type the right level
  number before typing `p`.
  v4 (2026-07-29), after three rounds of testing this live: PLAY/LEVEL SELECT
  are no longer pushbuttons at all. Traced (with Playwright driving the real
  editor headlessly, not guesswork) to a hard limitation of this Velxio
  version: `DynamicComponent.tsx` binds EVERY interactive part's click handler
  to a single global `useSimulatorStore().simulator` field, not a per-board
  one — so a pushbutton wired to the second board's pin ends up calling
  `setPinState` on the FIRST board's CPU instead of its own. No spec-level
  wiring fix exists for that (verified: direct-to-pin wiring, correct board
  ids, everything else here IS spec-fixable — this one isn't). Serial I/O,
  unlike component click handlers, IS properly per-board
  (`serialWriteToBoard(boardId, text)` / each board's own Serial Monitor tab)
  — so PLAY/LEVEL SELECT moved there instead. Two earlier, now-obsolete fixes
  along the way, for the record: the 7 finger pins must be driven OUTPUT
  (idle HIGH, LOW to "press"), never high-Z INPUT — this simulator doesn't
  model true floating inputs, so an idle INPUT pin reads a spurious LOW and,
  once wired board-to-board, that gets pushed straight onto piano's key nodes
  by Interconnect.ts and permanently "presses" them. And board ids must
  start with a recognised kind string (`arduino-nano`, `arduino-uno`, ...) —
  `isBoardComponent()` checks kind-prefixes, not whatever id the spec assigns,
  so custom ids like `piano`/`player` silently break every pushbutton's own
  pin-trace, piano's 7 keys included.
routing: loose   # each key node is now a 3-way junction (piano's own wire +
                 # button + player's finger wire); the strict lane router
                 # can't avoid every overlap there, and this circuit is a
                 # test aid, not the polished diagram — route anyway, report.
boards:
  - kind: arduino-nano
    sketch_file: ../firmware/src/main.cpp
    defines: [VELXIO_EMULATION]
    extra_files:
      - name: notes.h
        file: ../firmware/include/notes.h
      - name: mario_sfx.h
        file: ../firmware/include/mario_sfx.h
  - kind: arduino-uno
    sketch: |
      // Lemon Piano V5 — interactive-emulation "autoplayer" companion board.
      // Not part of the game: a virtual finger that plays a chosen level's
      // secret code onto the piano board's key nodes on request, so a human
      // tester doesn't have to click all ten correct lemons by hand to reach
      // a win. Piano's own pull-ups hold each node idle-high; this board does
      // exactly what a touch does — pulls one node low for a beat, then lets
      // go — so the piano firmware cannot tell a pulse from a real touch.
      //
      // Controlled over serial (type into THIS board's own Serial Monitor
      // tab), not physical buttons — see the file header for why: component
      // click handlers in this Velxio version are bound to a single global
      // simulator, not per-board, so a pushbutton on the second board can't
      // reliably poke its own CPU. Type '1'-'4' to arm a level (an LED shows
      // which), 'p' to play it.

      const uint8_t FINGER_PINS[7] = {6, 7, 8, 9, 10, 11, 12};  // key1..key7
      const uint8_t LEVEL_LEDS[4]  = {2, 3, 4, 5};              // level 1..4
      const uint8_t CODE_LEN = 10;

      // Same four secret codes as firmware/src/main.cpp's sequence_1..4, as
      // key numbers 1-7 (see that file's SECRET SEQUENCES comment).
      const uint8_t codes[4][CODE_LEN] = {
        {6, 5, 6, 7, 2, 5, 2, 1, 3, 4},   // level 1 - Overworld
        {3, 6, 1, 4, 2, 5, 3, 6, 1, 4},   // level 2 - Underworld
        {2, 4, 6, 1, 5, 3, 7, 4, 2, 6},   // level 3 - Underwater
        {5, 1, 3, 7, 2, 6, 4, 1, 5, 3},   // level 4 - Starman
      };

      uint8_t level = 0;   // 0..3 == level 1..4

      void showLevel() {
        for (uint8_t i = 0; i < 4; i++) {
          digitalWrite(LEVEL_LEDS[i], i == level ? HIGH : LOW);
        }
        Serial.print(F("Autoplayer armed for level "));
        Serial.println(level + 1);
      }

      // Finger pins are a driven OUTPUT, never high-Z INPUT, even while idle
      // (idle = HIGH). This simulator does not model true floating inputs:
      // an idle INPUT pin reads a spurious LOW, and since these are DIRECT
      // board-to-board wires (see the wires section), that floating LOW
      // would get pushed straight onto piano's key nodes by Interconnect.ts
      // and permanently "press" them.
      void releaseKey(uint8_t pin) { digitalWrite(pin, HIGH); }
      void pressKeyPin(uint8_t pin) { digitalWrite(pin, LOW); }

      void pressKey(uint8_t keyNumber) {   // 1..7
        uint8_t pin = FINGER_PINS[keyNumber - 1];
        pressKeyPin(pin);
        delay(90);
        releaseKey(pin);
        delay(300);                // gap so the piano's edge logic sees a
                                    // clean release before the next digit,
                                    // and two same-key digits (never
                                    // back-to-back in a real code) still land
                                    // as distinct presses
      }

      void playLevel() {
        digitalWrite(13, HIGH);     // onboard LED: "auto-playing" indicator
        Serial.print(F("Auto-playing level ")); Serial.println(level + 1);
        for (uint8_t i = 0; i < CODE_LEN; i++) {
          pressKey(codes[level][i]);
        }
        digitalWrite(13, LOW);
        Serial.println(F("Auto-play done."));
      }

      void setup() {
        for (uint8_t i = 0; i < 7; i++) {
          pinMode(FINGER_PINS[i], OUTPUT);
          releaseKey(FINGER_PINS[i]);   // idle: driven HIGH, matches piano's pull-up
        }
        for (uint8_t i = 0; i < 4; i++) {
          pinMode(LEVEL_LEDS[i], OUTPUT);
        }
        pinMode(13, OUTPUT);
        Serial.begin(9600);
        showLevel();
        Serial.println(F("Type 1-4 in THIS box to arm a level (see the LEDs),"));
        Serial.println(F("then 'p' to play it onto the piano's lemons. Match the"));
        Serial.println(F("number to piano's OWN serial log (\"Level N\") first."));
      }

      void loop() {
        if (Serial.available()) {
          char c = Serial.read();
          if (c >= '1' && c <= '4') {
            level = c - '1';
            showLevel();
          } else if (c == 'p' || c == 'P') {
            playLevel();
          }
          // anything else (newline, whitespace, ...) is silently ignored
        }
      }

