; Lemon Piano V5 — 10-LED progress-bar game firmware.
;
; Requires an Arduino Nano (or Mini): V5 uses A6 (key 7) and A7 (game select),
; which the classic Uno does not expose — so there is no `uno` env any more.
; The frozen V4 (with the Uno env, relays and red LED) lives in
; ../../archive/lemon-piano-v4/.
;
; nanoatmega328 → the Arduino Nano on the breadboard photo (most 2019-era
;     Nano clones ship the OLD bootloader, 57600 baud upload). Default build.
; nanoatmega328new → same board with the NEW bootloader (115200 baud).
;     Try this env if upload fails with "programmer not responding".
;
; Build:    pio run
; Flash:    pio run -t upload
; Monitor:  pio device monitor   (9600 baud; the game logs Game/OK/WIN/WRONG)

[platformio]
default_envs = nanoatmega328

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

; Compile-check for the Velxio emulation input shim (active-low digital/analog
; keys, game fixed to VELXIO_GAME, buzzer on D11). Never flashed to hardware —
; the Velxio pipeline builds this variant itself via the `defines:` field in
; ../emulation/lemon-piano.yaml.
[env:emulation]
board = nanoatmega328
build_flags = -DVELXIO_EMULATION
