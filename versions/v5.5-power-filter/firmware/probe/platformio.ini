; Board probe for the REAL v0.7.1 PCB — not a game, not a version.
;
; Flash this when the assembled board boots but plays nothing. It removes the
; game, the LED bar and the mode wheel and leaves the three things that can be
; broken: the seven key channels, the two SENS buttons, and D13/BUZ1.
;
; The game build's -DDEBUG_TOUCH cannot do this job: it prints only on an
; ACCEPTED press, so it prints nothing at all when the fault is that no press is
; ever accepted.
;
; Build:   pio run
; Flash:   pio run -t upload
; Watch:   pio device monitor      (9600 baud)

[env:nanoatmega328]
platform      = atmelavr
board         = nanoatmega328
framework     = arduino
monitor_speed = 9600

; Same board with the NEW bootloader (115200 upload). Try this if upload fails
; with "programmer not responding".
[env:nanoatmega328new]
platform      = atmelavr
board         = nanoatmega328new
framework     = arduino
monitor_speed = 9600
