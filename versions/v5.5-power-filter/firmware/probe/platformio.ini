; Board probe for the REAL v0.7.1 PCB — not a game, not a version.
;
; Flash this when the assembled board boots but plays nothing. It removes the
; game, the LED bar and the mode wheel and leaves the three things that can be
; broken: the seven key channels, the two SENS buttons, and D13/BUZ1.
;
; The game build's -DDEBUG_TOUCH cannot do this job: it prints only on an
; ACCEPTED press, so it prints nothing at all when the fault is that no press is
; ever accepted.
;
;   pio run -t upload && pio device monitor
;
; default_envs is NOT optional here. Without it `pio run -t upload` uploads with
; BOTH environments: the first succeeds, the second fails out of sync on a board
; that has just been reset, the whole command exits non-zero, and an `&& pio
; device monitor` after it never runs. That happened on 2026-09-12 and cost a
; whole round trip — the board was flashed correctly and printed to nobody.
[platformio]
default_envs = nanoatmega328

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

; Never let auto-detect pick the motherboard's /dev/ttyS0. It is not the Nano,
; it is not writable, and the error it gives ("Permission denied") reads like a
; permissions problem the user has to go and fix. The Nano's CH340 is ttyUSB*.
upload_port   = /dev/ttyUSB*
monitor_port  = /dev/ttyUSB*

[env:nanoatmega328]
board = nanoatmega328

; Same board with the NEW bootloader (115200 upload). Only if the default env
; fails to upload: pio run -e nanoatmega328new -t upload
[env:nanoatmega328new]
board = nanoatmega328new
