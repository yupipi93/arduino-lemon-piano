; Lemon Piano V0 — buzzer bring-up (a scale, forever).
;
; The smallest board in the project: an ATmega328 + one passive buzzer on D8.
; Nothing else is wired, so this build isolates the buzzer from the keyboard,
; the game and the touch sensing. See ../README.md.
;
; nanoatmega328 → default. Nano with the OLD bootloader (57600 baud upload) —
;     most 2019-era clones. tone() playback path.
; nanoatmega328new → same board, NEW bootloader (115200 baud). Try this env if
;     upload fails with "programmer is not responding" / an stk500 timeout.
; uno → Arduino Uno. V0 needs no A6/A7, so an Uno is perfectly fine here.
; nanoatmega328-buzz → the bit-banged buzz() playback path instead of tone(),
;     i.e. the code path playSong() uses for the Mario themes. Flash this to
;     find out whether only ONE of the two paths sounds wrong.
; emulation → compile-check the Velxio browser shim (buzzer moves to D11 and
;     clears OCR2A after each note). Never flashed to hardware.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor       (9600 baud — logs every note and its Hz)
[platformio]
default_envs = nanoatmega328

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:uno]
board = uno

[env:nanoatmega328-buzz]
board = nanoatmega328
build_flags = -DUSE_BUZZ

[env:emulation]
board = nanoatmega328
build_flags = -DVELXIO_EMULATION
