; touch-noise — bench instrument, not piano firmware.
;
; The V5.5 bench validation recipe on ONE channel, so it runs before the PCB
; exists: 220 Ω pull-up on A0, D13 flashes once per sample that a game would
; have read as a key press. Counts flashes on battery vs mains vs charging.
;
; Build:    pio run
; Flash:    pio run -t upload            (USB connected, module DISconnected)
; Monitor:  pio device monitor           (setup only — the real run has NO PC:
;                                         a PC ground re-creates the very
;                                         common-mode path being measured)
;
; See src/main.cpp for the wiring and the three-run protocol.

[platformio]
default_envs = nanoatmega328new

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328new]
board = nanoatmega328new

[env:nanoatmega328]
board = nanoatmega328
