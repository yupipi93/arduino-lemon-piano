; psu-probe — bench instrument, not piano firmware.
;
; Measures the rail the piano's ADC would use as its reference (AVcc, via the
; ATmega's 1.1 V bandgap), the cell voltage on A1, and counts power dropouts
; through an EEPROM boot counter. See src/main.cpp for the wiring and the
; ⚠ "never connect the Nano's USB while feeding its 5V pin" rule.
;
; Build:    pio run
; Flash:    pio run -t upload            (USB connected, module DISconnected)
; Monitor:  pio device monitor           (9600 baud — but see the CSV note below)
;
; Flash it with the Nano's own USB and the module unplugged, THEN move to the
; module + USB-TTL rig. Logging to a file:
;   pio device monitor -b 9600 | tee run-$(date +%H%M%S).csv
;
; nanoatmega328new first: the ATmega328PB USB-C clones in this bench kit ship
; the new bootloader (115200). Fall back to nanoatmega328 (57600) for older
; Nano clones.

[platformio]
default_envs = nanoatmega328new

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328new]
board = nanoatmega328new

[env:nanoatmega328]
board = nanoatmega328
