; Lemon Piano V2 — keyboard test (2019).
;
; The sketch folder is kept Arduino-IDE-compatible (folder name == .ino name),
; so `keyboard-test/keyboard-test.ino` still opens in the IDE; PlatformIO is
; pointed at it with `src_dir` instead of the usual `src/`.
;
; nanoatmega328 → default. The sketch reads A0..A6, and A6 only exists on the
;     Nano / Pro Mini (TQFP ATmega328P), so this is the env that builds the
;     complete 7-key keyboard. OLD bootloader (57600 baud upload).
; nanoatmega328new → same board with the NEW bootloader (115200 baud). Try this
;     env if upload fails with "programmer is not responding" / stk500 timeout.
; uno → the board the 2019 tutorial rig actually used. Keys 1-6 work; the DIP
;     ATmega328P has no A6 pin, so key 7 reads garbage. Kept because it is the
;     historical board (see ../HARDWARE.md § "Board note").
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (9600 baud; uncomment Serial.begin first — see
;          ../README.md § "Quirk worth knowing")
[platformio]
default_envs = nanoatmega328
src_dir = keyboard-test

[env]
platform      = atmelavr
framework     = arduino
monitor_speed = 9600

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new

[env:uno]
board = uno
