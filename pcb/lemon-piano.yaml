# Lemon Piano V5.5 Board — pcb-designer config
#
# Canonical configuration for the Lemon Piano V5.5 PCB (breadboard →
# fabricable board, same circuit as versions/v5.5-power-filter).
# The board lives in THIS repo under pcb/; the pcb-designer toolkit is the
# sibling repo ../eda-pcb-designer (consumed like eda-wirewright is by
# tools/wiring_diagrams.py). Netlist ground truth: pcb/docs/NETLIST.md.
# Placement rationale: pcb/docs/DECISIONS.md.
#
# Board frame: 120 × 40 mm (ADR-024), MT1 coordinate style
# (x 90..210, y 100..140; centre 150,120).
#
# v0.7.0 floor plan (user spec 2026-09-06 — supersedes the v0.5.0 plan):
#   - Nano socket CENTERED on the board (pin field 132.22..167.78 about
#     x=150, rows ±7.62 about y=120) and rotated 180° back so the
#     **mini-USB faces WEST** (ADR-035, supersedes ADR-029): the cable must
#     leave the enclosure on the left, away from the SENS buttons, with the
#     module SEATED — no more lifting the Nano to flash it. The flip puts
#     the DIGITAL column on the NORTH row and the ANALOG column on the SOUTH
#     row. Row maps per the real Nano (ADR-015: D12/D13 at the USB end).
#   - Lemon-key header on the SOUTH edge, CENTERED (J2 pins 141.11..158.89,
#     centre exactly x=150). Pin 1 = KEY1 at the WEST so KEY1..KEY7 sit
#     under A0..A6 (which now ASCEND west→east) with no crossings (ADR-036).
#   - LED bar on the NORTH edge, CENTERED on x=150. D2..D11 now DESCEND
#     west→east along the north row, so the bar runs LED1 EAST → LED10 WEST
#     for a non-crossing fan (ADR-036; same rule that produced v0.2.0-v0.4.0).
#   - USB-cable corridor REINSTATED on the west side (ADR-035, supersedes
#     ADR-030): x < 130.4, y 113..127 is part-free on F.Cu. It is exactly the
#     band ADR-024 defined and geometry_gate checks it against real courtyards.
#   - Power-entry filter folded around that corridor (ADR-037): C1 ‖ C3 stay
#     ADJACENT on the north row (ADR-031); D2 and L1 move OUT of the old
#     middle row into the south strip with J1 → D1, so the choke and the
#     Schottky no longer sit where the plug goes.
#   - 5 V input is a 2-pin 2.54 mm header (J1, ADR-025), not a screw block.
#   - SENS± buttons in the EAST block, the PAIR centred on y=120, each with
#     a parallel 2-pin external-button header (J3/J4, ADR-026) — unchanged.
#   - Buzzer in the NE corner (ADR-027) with J5 SPK beside it (ADR-034) —
#     unchanged; D13 is at the west end again so /BUZZER is long (accepted
#     in ADR-027 for exactly this orientation).
# ----------------------------------------------------------------------------

project:
  name: lemon-piano
  full_name: "Lemon Piano V5.5 Board"
  version: v0.7.1
  vendor: "Lemon Piano"
  kicad_project_dir: pcb/kicad
  kicad_pcb_file: lemon-piano.kicad_pcb
  kicad_sch_file: lemon-piano.kicad_sch
  validation_output_dir: pcb/validation
  renders_output_dir: pcb/renders
  tools_dir: pcb/tools
  releases_output_dir: pcb/releases

# ----------------------------------------------------------------------------
# Board outline + anchor dividers. Anchor zones (x<100, x>200) hold only the
# M2 holes; every other footprint stays between the dividers.
# ----------------------------------------------------------------------------
geometry:
  pcb:
    x0:  90.0
    y0: 100.0
    x1: 210.0
    y1: 140.0
  anchors:
    left_x:  100.0
    right_x: 200.0

# ----------------------------------------------------------------------------
# PLACEMENTS — [x_mm, y_mm, rot_deg, layer], footprint-origin coordinates.
# rot semantics (KiCad, verified empirically): rot=90 maps local +Y → +X
# (pin rows run EAST from pin 1); rot=270 runs WEST; rot=180 mirrors a
# horizontal 2-pad part (pad 2 lands WEST of pad 1).
# ----------------------------------------------------------------------------
placements:
  # ── Mounting holes: TWO per short edge, 5 mm insets, symmetric about
  #    x=150 and y=120 ─────────────────────────────────────────────────────
  H1: [95.0, 105.0, 0, F.Cu]
  H2: [205.0, 105.0, 0, F.Cu]
  H3: [95.0, 135.0, 0, F.Cu]
  H4: [205.0, 135.0, 0, F.Cu]

  # ── Nano socket rows, CENTERED, mini-USB facing the WEST edge (ADR-035) ─
  #    U1 = ANALOG column, now the SOUTH row, pin 1 (D13) at the WEST.
  #    U2 = DIGITAL column, now the NORTH row, pin 1 (TX1) at the EAST.
  U1: [132.22, 127.62,  90, F.Cu]   # south row: D13(west)..VIN(east)
  U2: [167.78, 112.38, 270, F.Cu]   # north row: TX1(east)..D12(west)

  # ── Lemon-key header: CENTERED on the SOUTH edge (pins 141.11..158.89),
  #    pin 1 = KEY1 at the WEST, under A0 (the analogs ascend west→east) ──
  J2: [141.11, 137.0, 90, F.Cu]

  # ── Power entry + filter, WEST block, folded around the USB-cable
  #    corridor (x < 130.4, y 113..127 kept part-free, ADR-035/037) ───────
  #    north row   C1 ‖ C3 (bulk caps, adjacent as in ADR-031)
  #    south strip D2 (row A) · J1 → D1 (row B) · L1 (own east column)
  C1: [108.0, 106.0, 0, F.Cu]      # 470u input reservoir (VRAW)
  C3: [118.0, 106.0, 0, F.Cu]      # 470u output reservoir (+5V)
  D2: [107.0, 129.2, 180, F.Cu]    # 1N5817: pad2 (A,VIN) west, pad1 (K,VRAW) east
  L1: [120.0, 134.5, 0, F.Cu]      # 100uH choke: pad1 VRAW (west), pad2 +5V (east)
  J1: [102.3, 136.0, 90, F.Cu]     # 5V IN, 2-pin header: pad1 (+), pad2 (−)
  D1: [109.2, 136.0, 0, F.Cu]      # P6KE6.8A TVS (vertical), K=VIN A=GND
  C2: [109.75, 112.5, 0, B.Cu]     # 100n input ceramic (bottom, at VRAW)
  C4: [119.25, 112.5, 0, B.Cu]     # 100n output ceramic (bottom, at +5V)

  # ── UI, EAST block (unchanged): SW1/SW2 pair centred on y=120, J3/J4
  #    parallel external-button headers (ADR-026), buzzer NE, J5 SPK ──────
  SW1: [175.0, 113.47, 0, F.Cu]    # SENS + (D12)
  SW2: [175.0, 122.01, 0, F.Cu]    # SENS − (A7)
  J3: [186.0, 117.97, 90, F.Cu]    # SENS+ external button (parallel to SW1)
  J4: [186.0, 126.51, 90, F.Cu]    # SENS− external button (parallel to SW2)
  BUZ1: [188.0, 106.78, 0, F.Cu]   # passive buzzer, pad1(+)=D13 net
  J5: [176.0, 104.0, 90, F.Cu]     # AUX speaker out, parallel to BUZ1 (ADR-034)

  # ── LED bar D3..D12 = LED1..LED10, NORTH strip, CENTRED on x=150 ──────
  # D2..D11 DESCEND west→east along the north row (D2 east at 157.62 …
  # D11 west at 134.76), so a non-crossing fan needs LED1 at the EAST end
  # (ADR-036). origin = cathode pad; rot=270 puts the anode 2.54 SOUTH
  # (toward the D2..D11 pins).
  D3:  [170.7, 101.65, 270, F.Cu]   # LED1  (green) — east end, under D2
  D4:  [166.1, 101.65, 270, F.Cu]
  D5:  [161.5, 101.65, 270, F.Cu]
  D6:  [156.9, 101.65, 270, F.Cu]
  D7:  [152.3, 101.65, 270, F.Cu]
  D8:  [147.7, 101.65, 270, F.Cu]
  D9:  [143.1, 101.65, 270, F.Cu]
  D10: [138.5, 101.65, 270, F.Cu]
  D11: [133.9, 101.65, 270, F.Cu]
  D12: [129.3, 101.65, 270, F.Cu]   # LED10 (red)   — west end, under D11

  # ── LED series resistors (bottom, offset +2.3 east of each LED) ─────────
  R8:  [173.0, 102.97, 90, B.Cu]
  R9:  [168.4, 102.97, 90, B.Cu]
  R10: [163.8, 102.97, 90, B.Cu]
  R11: [159.2, 102.97, 90, B.Cu]
  R12: [154.6, 102.97, 90, B.Cu]
  R13: [150.0, 102.97, 90, B.Cu]
  R14: [145.4, 102.97, 90, B.Cu]
  R15: [140.8, 102.97, 90, B.Cu]
  R16: [136.2, 102.97, 90, B.Cu]
  R17: [131.6, 102.97, 90, B.Cu]

  # ── Key pull-ups (bottom, just NORTH of the south analog row, x = its
  #    A-pin; the analogs ascend west→east: A0 at 139.84 … A7 at 157.62) ──
  R1: [139.84, 124.4, 90, B.Cu]    # KEY1 / A0
  R2: [142.38, 124.4, 90, B.Cu]
  R3: [144.92, 124.4, 90, B.Cu]
  R4: [147.46, 124.4, 90, B.Cu]
  R5: [150.0,  124.4, 90, B.Cu]
  R6: [152.54, 124.4, 90, B.Cu]
  R7: [155.08, 124.4, 90, B.Cu]    # KEY7 / A6
  R18: [157.62, 124.4, 90, B.Cu]   # SENS− pull-up / A7

