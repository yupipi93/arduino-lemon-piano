# Lemon Piano V5.5 Board — pcb-designer config
#
# Canonical configuration for the Lemon Piano V5.5 PCB (breadboard →
# fabricable board, same circuit as versions/v5.5-power-filter).
# The board lives in THIS repo under pcb/; the pcb-designer toolkit is the
# sibling repo ../eda-pcb-designer (consumed like eda-wirewright is by
# tools/wiring_diagrams.py). Netlist ground truth: pcb/docs/NETLIST.md.
# Placement rationale: pcb/docs/DECISIONS.md.
#
# Board frame: 120 × 40 mm (ADR-024), MT1 coordinate style
# (x 90..210, y 100..140; centre 150,120).
#
# v0.5.0 floor plan (user spec 2026-07-30 — supersedes the v0.4.0 plan):
#   - Nano socket CENTERED on the board (pin field 132.22..167.78 about
#     x=150, rows ±7.62 about y=120) and **FLIPPED 180°: mini-USB now faces
#     EAST** (ADR-029, supersedes ADR-002). The flip is what puts the ANALOG
#     column on the NORTH row and the DIGITAL column on the SOUTH row, so
#     the keys header can go north and the LED bar south as the user asked.
#     Row maps still per the real Nano (ADR-015: D12/D13 at the USB end).
#   - Lemon-key header on the NORTH edge, CENTERED (J2 pins 141.11..158.89,
#     centre exactly x=150). Pin 1 = KEY1 at the EAST so KEY1..KEY7 sit
#     under A0..A6 (which now descend west→east) with no crossings.
#   - LED bar on the SOUTH edge, CENTERED on x=150, ascending west→east
#     (D2..D11 now ascend west→east along the south row).
#   - Power-entry filter refactored into a compact 3-row WEST block
#     (ADR-031): C1 ‖ C3 ADJACENT on the north row, D2 + L1 on the middle
#     row, J1 → D1 on the south row. The USB-corridor keepout is GONE —
#     the user explicitly does not need clearance for the USB cable
#     (ADR-030), which is what freed the middle of the west block.
#   - 5 V input is a 2-pin 2.54 mm header (J1, ADR-025), not a screw block.
#   - SENS± buttons in the EAST block, the PAIR centred on y=120, each with
#     a parallel 2-pin external-button header (J3/J4, ADR-026).
#   - Buzzer in the NE corner (ADR-027) — now only ~20 mm from D13, which
#     the flip moved to the east end of the north row.
# ----------------------------------------------------------------------------

project:
  name: lemon-piano
  full_name: "Lemon Piano V5.5 Board"
  version: v0.6.0
  vendor: "Lemon Piano"
  kicad_project_dir: pcb/kicad
  kicad_pcb_file: lemon-piano.kicad_pcb
  kicad_sch_file: lemon-piano.kicad_sch
  validation_output_dir: pcb/validation
  renders_output_dir: pcb/renders
  tools_dir: pcb/tools
  releases_output_dir: pcb/releases

# ----------------------------------------------------------------------------
# Board outline + anchor dividers. Anchor zones (x<100, x>200) hold only the
# M2 holes; every other footprint stays between the dividers.
# ----------------------------------------------------------------------------
geometry:
  pcb:
    x0:  90.0
    y0: 100.0
    x1: 210.0
    y1: 140.0
  anchors:
    left_x:  100.0
    right_x: 200.0

# ----------------------------------------------------------------------------
# PLACEMENTS — [x_mm, y_mm, rot_deg, layer], footprint-origin coordinates.
# rot semantics (KiCad, verified empirically): rot=90 maps local +Y → +X
# (pin rows run EAST from pin 1); rot=270 runs WEST; rot=180 mirrors a
# horizontal 2-pad part (pad 2 lands WEST of pad 1).
# ----------------------------------------------------------------------------
placements:
  # ── Mounting holes: TWO per short edge, 5 mm insets, symmetric about
  #    x=150 and y=120 ─────────────────────────────────────────────────────
  H1: [95.0, 105.0, 0, F.Cu]
  H2: [205.0, 105.0, 0, F.Cu]
  H3: [95.0, 135.0, 0, F.Cu]
  H4: [205.0, 135.0, 0, F.Cu]

  # ── Nano socket rows, CENTERED, FLIPPED: USB faces the EAST edge ────────
  #    U1 = ANALOG column, now the NORTH row, pin 1 (D13) at the EAST.
  #    U2 = DIGITAL column, now the SOUTH row, pin 1 (TX1) at the WEST.
  U1: [167.78, 112.38, 270, F.Cu]   # north row: D13(east)..VIN(west)
  U2: [132.22, 127.62,  90, F.Cu]   # south row: TX1(west)..D12(east)

  # ── Lemon-key header: CENTERED on the NORTH edge (pins 141.11..158.89),
  #    pin 1 = KEY1 at the EAST, under A0 ─────────────────────────────────
  J2: [158.89, 103.0, 270, F.Cu]

  # ── Power entry + filter: compact 3-row WEST block (ADR-031) ────────────
  #    north row  C1 ‖ C3 (the two bulk caps, adjacent as requested)
  #    middle row D2 → L1  (VIN→VRAW→+5V, 5.5 mm apart)
  #    south row  J1 → D1  (entry + TVS right at the terminals)
  C1: [108.0, 106.0, 0, F.Cu]      # 470u input reservoir (VRAW)
  C3: [118.0, 106.0, 0, F.Cu]      # 470u output reservoir (+5V)
  D2: [110.0, 119.0, 180, F.Cu]    # 1N5817: pad2 (A,VIN) west, pad1 (K,VRAW) east
  L1: [115.5, 119.0, 0, F.Cu]      # 100uH choke: pad1 VRAW, pad2 +5V
  J1: [102.3, 134.5, 90, F.Cu]     # 5V IN, 2-pin header: pad1 (+), pad2 (−)
  D1: [109.2, 134.5, 0, F.Cu]      # P6KE6.8A TVS (vertical), K=VIN A=GND
  C2: [109.75, 112.5, 0, B.Cu]     # 100n input ceramic (bottom, at VRAW)
  C4: [119.25, 112.5, 0, B.Cu]     # 100n output ceramic (bottom, at +5V)

  # ── UI, EAST block. The SW1/SW2 pair is centred on y=120; J3/J4 are the
  #    parallel external-button headers (ADR-026) ─────────────────────────
  SW1: [175.0, 113.47, 0, F.Cu]    # SENS + (D12)
  SW2: [175.0, 122.01, 0, F.Cu]    # SENS − (A7)
  J3: [186.0, 117.97, 90, F.Cu]    # SENS+ external button (parallel to SW1)
  J4: [186.0, 126.51, 90, F.Cu]    # SENS− external button (parallel to SW2)
  BUZ1: [188.0, 106.78, 0, F.Cu]   # passive buzzer, pad1(+)=D13 net
  J5: [176.0, 104.0, 90, F.Cu]     # AUX speaker out, parallel to BUZ1 (ADR-034)

  # ── LED bar D3..D12 = LED1..LED10, SOUTH strip, CENTRED on x=150 ──────
  # (D2..D11 now ascend west→east along the south row, so a non-crossing fan
  # needs LED1 at the WEST end). origin = cathode pad; rot=90 puts the anode
  # 2.54 NORTH (toward the D2..D11 pins).
  D3:  [129.3, 138.35, 90, F.Cu]
  D4:  [133.9, 138.35, 90, F.Cu]
  D5:  [138.5, 138.35, 90, F.Cu]
  D6:  [143.1, 138.35, 90, F.Cu]
  D7:  [147.7, 138.35, 90, F.Cu]
  D8:  [152.3, 138.35, 90, F.Cu]
  D9:  [156.9, 138.35, 90, F.Cu]
  D10: [161.5, 138.35, 90, F.Cu]
  D11: [166.1, 138.35, 90, F.Cu]
  D12: [170.7, 138.35, 90, F.Cu]

  # ── LED series resistors (bottom, offset +2.3 east of each LED) ─────────
  R8:  [131.6, 137.03, 90, B.Cu]
  R9:  [136.2, 137.03, 90, B.Cu]
  R10: [140.8, 137.03, 90, B.Cu]
  R11: [145.4, 137.03, 90, B.Cu]
  R12: [150.0, 137.03, 90, B.Cu]
  R13: [154.6, 137.03, 90, B.Cu]
  R14: [159.2, 137.03, 90, B.Cu]
  R15: [163.8, 137.03, 90, B.Cu]
  R16: [168.4, 137.03, 90, B.Cu]
  R17: [173.0, 137.03, 90, B.Cu]

  # ── Key pull-ups (bottom, just SOUTH of the north row, x = its A-pin;
  #    the analogs descend west→east now: A0 at 160.16 … A7 at 142.38) ──────
  R1: [160.16, 115.6, 90, B.Cu]    # KEY1 / A0
  R2: [157.62, 115.6, 90, B.Cu]
  R3: [155.08, 115.6, 90, B.Cu]
  R4: [152.54, 115.6, 90, B.Cu]
  R5: [150.0,  115.6, 90, B.Cu]
  R6: [147.46, 115.6, 90, B.Cu]
  R7: [144.92, 115.6, 90, B.Cu]    # KEY7 / A6
  R18: [142.38, 115.6, 90, B.Cu]   # SENS− pull-up / A7

