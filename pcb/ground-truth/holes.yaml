# GROUND TRUTH — anchor holes of the Lemon Piano V5.5 board.
#
# Verified by pcb_designer.verify.holes:
#   - geometric: design (.kicad_pcb) vs this file (position + Ø + pattern)
#   - vision:    detected centres on the render vs this file
#
# Coordinate system: KiCad global, +X right, +Y DOWN, mm.
# Board frame origin: top-left Edge.Cuts corner at (90,100).

meta:
  board: lemon-piano
  version: v0.4.0
  units: mm
  axes: "KiCad global: +X right, +Y down"
  pcb_outline_mm: [90.0, 100.0, 210.0, 140.0]   # 120 x 40 mm (v0.4.0)
  pos_tol_mm: 0.10
  dia_tol_mm: 0.10
  cv_tol_mm: 0.30

# Footprint MountingHole:MountingHole_2.5mm_Pad_Via — drill Ø2.5 mm
# (M2 screw, loose/medium ISO 273 fit), copper annulus Ø5.0 mm + 8
# stitching vias. Same part and rationale as MT1 (see the MT1
# ground-truth citations, verified 2026-06-17).
screw: M2
drill_dia_mm: 2.5
pad_dia_mm: 5.0

# FOUR anchor holes (v0.4.0 frame): two per short edge, 5 mm insets from
# both edges, mirror-symmetric about x = 150 and y = 120.
holes:
  H1: {x: 95.0,  y: 105.0, group: left_anchor}
  H2: {x: 205.0, y: 105.0, group: right_anchor}
  H3: {x: 95.0,  y: 135.0, group: left_anchor}
  H4: {x: 205.0, y: 135.0, group: right_anchor}

expected_spacings:
  - {a: H1, b: H2, axis: x, mm: 110.0}  # top pair, symmetric about x=150
  - {a: H3, b: H4, axis: x, mm: 110.0}  # bottom pair
  - {a: H1, b: H3, axis: y, mm: 30.0}   # left column
  - {a: H2, b: H4, axis: y, mm: 30.0}   # right column
