# Per-module overlay config for the Lemon Piano V5.5 board.
# Consumed by the pcb-designer /render?style=overlay endpoint (the client
# uploads this file + the images in component-images/), or locally by
# python3 -m pcb_designer.render_overlay.cli.
#
# Conventions: see the schema notes in the MT1 worked example
# (eda-pcb-designer/projects/mt1/overlays/modules.yaml).
#
# Image provenance (v0.3.0, replaces the darker clone photo): tight crop
# of Wikimedia Commons "File:Arduino nano.jpg" (CC BY-SA 4.0) — a bright,
# perpendicular studio shot of an Arduino Nano, mini-USB at the LEFT.
# Measured scale 57.95 px/mm (pin-row spacing 882 px = 15.24 mm; pin span
# 2063 px = 35.56 mm — consistent to <0.2%). Crop includes the mini-USB
# (1.7 mm proud, west) and the ICSP header (1.0 mm proud, east).

modules:
  NANO:
    refs: [U1, U2]
    anchor_ref: U1
    positioning: bbox_center
    image: arduino-nano.png
    # Native crop (2664x1046 landscape) is ALREADY the board pose: USB
    # west, top row D12..TX1, bottom row D13 3.3V REF A0..A7 5V RST GND
    # VIN — exactly the v0.2.0+ socket rows. The engine composes
    # PIL_rot = -pcb_rotation + image_rotation (MT1-calibrated
    # convention), anchor U1 is at rot=90, so image_rotation=90 yields
    # net rotation 0 (photo pasted as-is).
    real_size_mm: [45.97, 18.05]    # native [w,h] at 57.95 px/mm
    image_rotation_deg: 90
    # bbox_center of U1+U2 = pin-field centre. The crop's centre sits
    # (-0.11, +0.29) mm from it in BOARD coords (USB + south-row bias);
    # expressed in module-local coords (rot90: board=(ly,-lx)):
    body_offset_mm: [-0.29, -0.11]
    visible_layer: F.Cu
    category: module
